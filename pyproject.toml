[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paylab-dev"
version = "0.5.0"
description = "Open-source payment reliability and chaos-testing toolkit for webhook integrations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Olawumi Oluwafemi" }]
keywords = ["payments", "webhooks", "testing", "chaos-engineering", "fastapi", "paystack", "stripe", "flutterwave", "monnify", "razorpay"]
classifiers = ["Development Status :: 3 - Alpha", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Topic :: Software Development :: Testing"]
dependencies = ["fastapi>=0.115,<1.0", "httpx>=0.27,<1.0", "pydantic>=2.9,<3.0", "typer>=0.12,<1.0", "uvicorn[standard]>=0.30,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "pytest-asyncio>=0.24,<1.0", "pyyaml>=6.0,<7.0", "ruff>=0.8,<1.0"]
postgres = ["psycopg[binary]>=3.2,<4.0"]
redis = ["redis>=5.2,<7.0"]

[project.scripts]
paylab = "paylab.cli:app"

[project.urls]
Homepage = "https://github.com/Oluwafemi1x/PayLab"
Repository = "https://github.com/Oluwafemi1x/PayLab"
Issues = "https://github.com/Oluwafemi1x/PayLab/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/paylab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
