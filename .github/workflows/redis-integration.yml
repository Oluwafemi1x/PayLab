name: Redis Integration

on:
  push:
  pull_request:

jobs:
  redis-stream:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PAYLAB_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Redis test dependencies
        run: pip install -e ".[dev,redis]"
      - name: Start demo merchant
        run: |
          uvicorn examples.demo_receiver:app --host 127.0.0.1 --port 9000 > /tmp/paylab-demo.log 2>&1 &
          python - <<'PY'
          import time
          import httpx
          for _ in range(40):
              try:
                  if httpx.get("http://127.0.0.1:9000/", timeout=1).status_code == 200:
                      break
              except httpx.HTTPError:
                  time.sleep(0.25)
          else:
              raise SystemExit("demo merchant did not start")
          PY
      - name: Run Redis integration tests
        run: pytest -q tests/test_redis_stream.py tests/test_redis_worker.py
