name: Redis Integration

on:
  push:
  pull_request:

jobs:
  redis-stream:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PAYLAB_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Redis test dependencies
        run: pip install -e ".[dev,redis]"
      - name: Run Redis integration tests
        run: pytest -q tests/test_redis_stream.py
