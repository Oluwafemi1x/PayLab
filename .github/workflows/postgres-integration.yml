name: PostgreSQL Integration

on:
  push:
  pull_request:

jobs:
  postgres-history:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: paylab
          POSTGRES_PASSWORD: paylab
          POSTGRES_DB: paylab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paylab -d paylab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PAYLAB_TEST_POSTGRES_URL: postgresql://paylab:paylab@127.0.0.1:5432/paylab
      PAYLAB_DATABASE_URL: postgresql://paylab:paylab@127.0.0.1:5432/paylab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL test dependencies
        run: pip install -e ".[dev,postgres]"
      - name: Run PostgreSQL integration tests
        run: pytest -q tests/test_postgres_history.py
