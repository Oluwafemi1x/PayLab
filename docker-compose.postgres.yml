services:
  paylab:
    environment:
      PAYLAB_DATABASE_URL: postgresql://paylab:paylab@postgres:5432/paylab
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: paylab
      POSTGRES_PASSWORD: paylab
      POSTGRES_DB: paylab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paylab -d paylab"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - paylab-postgres:/var/lib/postgresql/data

volumes:
  paylab-postgres:
